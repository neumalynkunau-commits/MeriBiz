<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#176b57"><meta name="description" content="Browse products and services from MeriBiz PNG businesses."><title>MeriBiz PNG — Public Shop</title>
<style>
:root{--green:#176b57;--deep:#104638;--mint:#eaf4ee;--cream:#f6f8f5;--ink:#18231f;--muted:#68766e;--line:#dfe8e1}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}.top{background:white;border-bottom:1px solid var(--line);padding:18px clamp(16px,4vw,44px);display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{font-weight:850;font-size:21px}.brand span{color:var(--green)}.top a{color:var(--green);font-weight:700;text-decoration:none}.wrap{max-width:1200px;margin:auto;padding:28px clamp(16px,4vw,44px) 50px}.hero{background:linear-gradient(135deg,#eaf4ee,#fff);border:1px solid var(--line);border-radius:20px;padding:26px;margin-bottom:22px}.hero h1{font-size:clamp(25px,4vw,38px);line-height:1.15;letter-spacing:-1px;margin:0 0 8px}.hero p{color:var(--muted);margin:0}.tools{display:flex;gap:10px;margin:18px 0;flex-wrap:wrap}.tools input,.tools select{font:inherit;padding:12px;border:1px solid #d5e0d7;border-radius:11px;background:white;min-width:190px;flex:1}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:15px}.card{background:white;border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}.pic{aspect-ratio:4/3;background:#edf3ee;display:grid;place-items:center;color:var(--muted);overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover}.details{padding:16px;display:flex;flex-direction:column;gap:9px;flex:1}.tag{display:inline-block;width:max-content;background:var(--mint);color:var(--green);font-size:11px;font-weight:800;border-radius:99px;padding:4px 9px}.details h2{font-size:18px;line-height:1.25;margin:0}.price{font-weight:850;font-size:20px;color:var(--green)}.muted{color:var(--muted);font-size:13px;margin:0}.business{font-weight:750}.desc{margin:0;color:#435249;white-space:pre-wrap;overflow-wrap:anywhere}.order{margin-top:auto;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;background:var(--green);color:white;padding:11px 13px;border-radius:10px;font-weight:750}.order:hover{background:var(--deep)}.empty{padding:30px;background:white;border:1px dashed #d4dfd6;border-radius:14px;text-align:center;color:var(--muted);grid-column:1/-1}.status{color:var(--muted);font-size:13px;margin:12px 0}.foot{text-align:center;color:var(--muted);font-size:12px;padding:28px 10px 0}
</style></head><body>
<header class="top"><div class="brand">MeriBiz <span>PNG</span></div><a href="index.html">Seller sign in →</a></header>
<main class="wrap"><section class="hero"><h1>Shop local. Support Meri.</h1><p>Explore products and services shared by women entrepreneurs across Papua New Guinea.</p></section>
<div class="tools"><input id="search" type="search" placeholder="Search products, businesses or location…" aria-label="Search catalogue"><select id="category" aria-label="Filter by category"><option value="">All categories</option></select></div><div id="status" class="status" role="status">Loading public products…</div><section id="catalogue" class="grid"></section><div class="foot">MeriBiz PNG · Made for women building businesses across Papua New Guinea 🇵🇬</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app-config.js"></script>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'K'+Number(n||0).toLocaleString('en-PG',{minimumFractionDigits:2,maximumFractionDigits:2});let rows=[];function render(){const q=$('search').value.trim().toLowerCase(),cat=$('category').value;const filtered=rows.filter(p=>(!cat||p.category===cat)&&(!q||[p.product_name,p.business_name,p.location,p.category,p.description].some(v=>String(v||'').toLowerCase().includes(q))));$('catalogue').innerHTML=filtered.length?filtered.map(p=>{const phone=String(p.whatsapp||'').replace(/\D/g,'');const message=encodeURIComponent('Hello, I am interested in '+p.product_name+' listed for '+money(p.price)+'.');const image=p.public_image_path?MERIBIZ_CONFIG.url.replace(/\/$/,'')+'/storage/v1/object/public/public-product-images/'+p.public_image_path.split('/').map(encodeURIComponent).join('/') :'';return `<article class="card"><div class="pic">${image?`<img src="${safe(image)}" alt="${safe(p.product_name)}" loading="lazy" onerror="this.parentElement.textContent='Product picture unavailable'">`:'No picture added'}</div><div class="details"><span class="tag">${safe(p.category||'Other')}</span><h2>${safe(p.product_name)}</h2><div class="price">${money(p.price)}</div><p class="business">${safe(p.business_name)}</p><p class="muted">${safe(p.location||'Papua New Guinea')}</p>${p.description?`<p class="desc">${safe(p.description)}</p>`:''}${phone?`<a class="order" href="https://wa.me/${safe(phone)}?text=${message}" target="_blank" rel="noopener">Message seller on WhatsApp</a>`:'<p class="muted">Contact details not provided for this product.</p>'}</div></article>`}).join(''):'<div class="empty">No public products match your search yet.</div>';$('status').textContent=`Showing ${filtered.length} of ${rows.length} public product${rows.length===1?'':'s'}.`}
async function init(){if(!window.supabase||!window.MERIBIZ_CONFIG||!MERIBIZ_CONFIG.url||!MERIBIZ_CONFIG.anonKey){$('status').textContent='Catalogue setup is incomplete. Please try again later.';return}const client=window.supabase.createClient(MERIBIZ_CONFIG.url,MERIBIZ_CONFIG.anonKey);const {data,error}=await client.rpc('get_public_catalogue');if(error){console.error(error);$('status').textContent='Could not load the catalogue. Please try again later.';return}rows=data||[];const categories=[...new Set(rows.map(p=>p.category).filter(Boolean))].sort();$('category').innerHTML='<option value="">All categories</option>'+categories.map(c=>`<option value="${safe(c)}">${safe(c)}</option>`).join('');render()}$('search').addEventListener('input',render);$('category').addEventListener('change',render);init();})();
</script></body></html>
